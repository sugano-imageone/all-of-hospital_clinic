[project]
name = "imageone-medical-directory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.3", "uvicorn==0.38.0", "httpx==0.28.1",
  "jinja2==3.1.6", "openpyxl==3.1.5", "xlrd==2.0.2",
  "beautifulsoup4==4.14.2", "python-multipart==0.0.20", "defusedxml==0.7.1"
]
[project.optional-dependencies]
test = ["pytest==9.0.1", "psycopg[binary]==3.2.10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

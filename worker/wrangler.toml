name = "imageone-medical-migration-api"
main = "src/index.mjs"
compatibility_date = "2026-10-19"
workers_dev = true
preview_urls = false

[vars]
MAINTENANCE = "true"
ALLOWED_ORIGIN = "https://sugano-imageone.github.io"
TURSO_DATABASE_URL = "libsql://imageone-medical-sugano-imageone.aws-ap-northeast-1.turso.io"
# Turso URL/owner/Free/Tokyo confirmed from the user's dashboard; database still empty.
# Set FIREBASE_PROJECT_ID only after verifying the project.
# TURSO_AUTH_TOKEN must be set with `wrangler secret put`, never in this file.
# No deployment workflow is enabled during migration validation.

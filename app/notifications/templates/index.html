<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医療機関の届出事項｜開発確認</title><style>
body{font-family:system-ui,sans-serif;color:#173d47;background:#f4f7f8;margin:0}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:1.7rem}.notice{padding:12px;background:#e0eef0;border-left:4px solid #196277}section,form{background:white;padding:20px;border-radius:10px;margin:18px 0}label{display:inline-flex;flex-direction:column;gap:6px;margin:8px 14px 8px 0}input,select,button{font:inherit;padding:9px;border:1px solid #a8bdc3;border-radius:5px}button{cursor:pointer;background:#196277;color:white}button:disabled{opacity:.45;cursor:default}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:9px;border-bottom:1px solid #dbe5e8;vertical-align:top}th{background:#eff5f6}td:nth-child(2){white-space:pre-line}td:first-child,td button{white-space:nowrap}pre{white-space:pre-wrap}details{margin:8px 0;padding:8px;background:#f5f9fa}.scroll{overflow:auto}small{color:#526b73}#notification{width:min(520px,78vw)}#message{white-space:pre-wrap}a{color:#075c7e}
</style></head><body><main><h1>医療機関の届出事項</h1><p class="notice">開発確認用。本番システムへの反映は行っていません。</p>
<form id="search"><div><label>加算名・届出名（名称の一部でも検索可能）<input id="notification" name="notification" list="notifications" placeholder="例：電子的診療情報連携体制整備加算"></label><datalist id="notifications"></datalist><label>届出の有無<select name="mode"><option value="filed">届出済の</option><option value="not_filed">未届出の</option></select></label></div><label>施設区分<select name="kind"><option value="">病院・診療所</option><option>病院</option><option>診療所</option></select></label><label>診療科目<select name="department" id="departments"><option value="">すべて</option></select></label><label>都道府県<select name="prefecture" id="prefectures"><option value="">全国</option></select></label><label>10桁医療機関コード<input name="code" maxlength="10" pattern="[0-9]{10}"></label><label>医療機関名<input name="name"></label><button type="submit">この条件で検索</button><p><small>厚生局の届出受理名簿に基づく検索です。実際の算定実績を示すものではありません。資料に施設の掲載がない場合は「未届出」に含めません。診療科目は厚生局の原表記と公式略称一覧に基づき検索分類します。未記載の施設は科目指定検索から除きます。</small></p></form>
<p id="message" role="status"></p><section><h2 id="count">検索結果</h2><div class="scroll"><table><thead><tr><th>医療機関コード</th><th>医療機関名／所在地</th><th>施設区分</th><th>診療科目（原表記）</th><th>全届出</th><th>届出資料の基準日</th></tr></thead><tbody id="results"></tbody></table></div><p><button id="prev" disabled>前へ</button> <span id="page"></span> <button id="next" disabled>次へ</button></p></section><section><h2>取込・重複検査</h2><button id="audit">検査結果を確認</button><pre id="audit-result"></pre></section></main><script>
const $=s=>document.querySelector(s);let page=1,last=null;
async function get(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw Error(d.detail||'取得に失敗しました');return d;}
function td(row,text){const e=document.createElement('td');e.textContent=text??'';row.append(e);return e;}
async function search(reset=true){if(reset)page=1;const p=reset?new URLSearchParams(new FormData($('#search'))):new URLSearchParams(last);for(const [k,v]of [...p])if(!v)p.delete(k);p.set('page',page);last=p;$('#message').textContent='検索しています…';try{const d=await get('/api/search?'+p);$('#results').replaceChildren();$('#count').textContent='検索結果 '+d.total.toLocaleString()+' 件';for(const item of d.items){const row=document.createElement('tr');td(row,item.code);td(row,item.name+'\n'+item.address);td(row,item.kind);td(row,item.departments_raw.join(' / ')||'未記載');const cell=td(row,'');const b=document.createElement('button');b.textContent='全届出 '+item.filing_count+' 件';b.onclick=()=>showFilings(cell,item.code,b);cell.append(b);td(row,item.notification_reference_date||'未確認');$('#results').append(row);}$('#prev').disabled=page<=1;$('#next').disabled=page*50>=d.total;$('#page').textContent=page+' / '+Math.max(1,Math.ceil(d.total/50));$('#message').textContent= d.unconfirmed_institutions?'同じ地域・科目等の条件で、届出資料に施設掲載がない未確認の医療機関 '+d.unconfirmed_institutions+' 件があります。「未届出」には含めていません。':'';}catch(e){$('#message').textContent=e.message;}}
async function showFilings(cell,code,button){button.disabled=true;try{const data=await get('/api/institutions/'+code+'/filings');for(const f of data.items){const details=document.createElement('details'),sum=document.createElement('summary');sum.textContent=f.official_name+' ／ '+f.receipt_number+' ／ '+f.start_date;details.append(sum);let loaded=false;details.ontoggle=async()=>{if(!details.open||loaded)return;try{const d=await get('/api/filings/'+f.id);for(const raw of d.items){const block=document.createElement('details'),s=document.createElement('summary');s.textContent=raw.filename+' ／ '+raw.sheet+' ／ 元行 '+raw.row;block.append(s);const t=document.createElement('table');for(const [k,v]of Object.entries(raw.values)){const tr=document.createElement('tr');td(tr,k);td(tr,v);t.append(tr);}block.append(t);const a=document.createElement('a');a.href=raw.source_url;a.textContent='厚生局の元資料';a.target='_blank';a.rel='noopener';block.append(a);details.append(block);}loaded=true;}catch(e){$('#message').textContent=e.message;}};cell.append(details);}}catch(e){$('#message').textContent=e.message;}finally{button.remove();}}
$('#search').onsubmit=e=>{e.preventDefault();search();};$('#prev').onclick=()=>{page--;search(false);};$('#next').onclick=()=>{page++;search(false);};$('#audit').onclick=async()=>{const b=$('#audit');b.disabled=true;try{const d=await get('/api/audit');$('#audit-result').textContent='制度関連公表の確認待ち：'+d.policy_events.length+' 件\n切替保留（差分異常）：'+d.pending_review+' 件\n取込済み：'+d.prefectures+' 都道府県\n医科の届出：'+d.current_filings.toLocaleString()+' 件\n元行：'+d.expected_rows.toLocaleString()+'／保存行：'+d.current_rows.toLocaleString()+'\n元行・保存行の一致：'+(d.row_counts_match?'OK':'要確認')+'\n医療機関コードの重複：'+d.duplicate_codes+' 件\n届出キーの重複：'+d.duplicate_filing_keys+' 件\n関連付けエラー：'+d.foreign_key_errors+' 件\n診療科目が未記載：'+d.departments_missing.toLocaleString()+' 施設\n医科以外の元行（医科一覧には混在させず保持）：'+d.nonmedical_original_rows.toLocaleString()+' 行'+(d.reviews.length?'\n\n切替保留の詳細：\n'+JSON.stringify(d.reviews,null,2):'');}catch(e){$('#audit-result').textContent=e.message;}finally{b.disabled=false;}};
get('/api/options').then(d=>{for(const name of d.notifications){const e=document.createElement('option');e.value=name;$('#notifications').append(e);}for(const name of d.departments){const e=document.createElement('option');e.value=name;e.textContent=name;$('#departments').append(e);}for(const p of d.prefectures){const e=document.createElement('option');e.value=p.code;e.textContent=p.name;$('#prefectures').append(e);}}).catch(e=>$('#message').textContent=e.message);
</script></body></html>

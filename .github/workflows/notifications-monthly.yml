name: Monthly medical notifications
on:
  schedule:
    # JST 09:20 on the 20th and 25th; DB enforces actual JST date.
    - cron: '20 0 20,25 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medical-notifications-production
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1 beautifulsoup4==4.14.2 openpyxl==3.1.5
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify replacement, retry and search rules
        run: python -m unittest discover -s scripts/facility_notifications -p 'test_*.py'
      - name: Collect, validate and atomically replace successful bureaus
        run: python scripts/facility_notifications/production.py --root work/notifications
      - name: Preserve official raw sources and verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facility-notifications-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/notifications/attempts/**/raw/
            work/notifications/attempts/**/source-pages/
            work/notifications/attempts/**/sources.json
            work/notifications/attempts/**/manifest.json
            work/notifications/attempts/**/validation.json
            work/notifications/attempts/**/latest-validation.json
            work/notifications/attempts/**/*.log
            work/notifications/production-result.json
          if-no-files-found: warn
          retention-days: 90

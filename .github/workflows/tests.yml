name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/postgres
      TEST_EXISTING_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/directory_existing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check app/static/app.js
      - run: node --check web/pages.js
      - run: node --test web/admin-users.test.mjs
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/001_initial.sql -f sql/002_import.sql -f sql/003_update_jobs.sql -f sql/005_reporting.sql
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create database directory_existing_test'
      - run: psql "$TEST_EXISTING_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
      - run: python -m pytest -q
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/security.sql
